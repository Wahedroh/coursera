name: Backup database

# สำรองฐานข้อมูล D1 ทั้งหมดเป็นไฟล์ .sql.gz ลง R2 bucket "classroom-backups" (ส่วนตัว ไม่เปิดสาธารณะ)
# ทุกวันอาทิตย์ 02:00 น. เวลาไทย · กดรันเองได้ที่แท็บ Actions → Backup database → Run workflow
# เก็บย้อนหลัง 180 วัน (กฎ lifecycle ลบไฟล์เก่าให้เอง) · ครูดาวน์โหลดได้ที่เมนู "พื้นที่ไฟล์"
# ไม่เก็บเป็น artifact ของ GitHub เพราะ repo นี้เป็นสาธารณะ (ข้อมูลนักเรียนต้องไม่หลุด)
on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export D1
        run: |
          npx wrangler d1 export classroom --remote --output backup.sql -y
          test -s backup.sql
          gzip -9 backup.sql
          echo "NAME=$(TZ=Asia/Bangkok date +%Y-%m-%d-%H%M).sql.gz" >> "$GITHUB_ENV"
          ls -la backup.sql.gz
      - name: Upload to R2
        run: npx wrangler r2 object put "classroom-backups/db/$NAME" --file backup.sql.gz --content-type application/gzip --remote
      - name: Keep 180 days
        run: npx wrangler r2 bucket lifecycle add classroom-backups expire-old-backups db/ --expire-days 180 -y || echo "lifecycle rule already set"
